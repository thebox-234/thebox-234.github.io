<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#f4f4f6;--card:#fff;--ink:#16171b;--sub:#7b7f8c;--line:#e6e7eb;--pt:#00b860}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);font-family:'Noto Sans KR','Noto Sans CJK KR',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto}
/* 상단 바 */
#bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#bar .wrap{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px}
#logo{font-family:'Black Han Sans',sans-serif;font-size:22px;letter-spacing:.5px;color:var(--pt)}
#bar .ttl{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;border:0;background:transparent}
/* 작품 홈 */
.hero{position:relative;background:#0b0d13;color:#fff;overflow:hidden}
.hero img{display:block;width:100%;height:auto;opacity:.9}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,19,0) 35%,rgba(11,13,19,.92) 88%)}
.hero .info{position:absolute;left:0;right:0;bottom:0;padding:22px 20px 24px}
.hero h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:34px;margin:0 0 6px;letter-spacing:1px}
.hero .au{font-size:14px;color:#c9ccd6}
.tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tags span{font-size:12px;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.14);color:#e9ebf2}
.box{background:var(--card);padding:18px 20px;border-bottom:1px solid var(--line)}
.logline{font-size:14.5px;line-height:1.75;color:#3a3d47;margin:0}
.acts{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;height:46px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.main{background:var(--pt);border-color:var(--pt);color:#fff}
.btn .heart{color:#ff4d6d}
.lhead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.lhead b{font-size:15px}
.lhead button{border:0;background:none;color:var(--sub);font-size:13px}
.lhead button.on{color:var(--ink);font-weight:700}
.ep{display:flex;gap:14px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.ep img{width:96px;height:96px;border-radius:8px;object-fit:cover;flex:none;background:#ddd}
.ep .t{font-size:15px;font-weight:700;margin-bottom:6px}
.ep .m{font-size:12.5px;color:var(--sub);display:flex;gap:10px;align-items:center}
.ep .m .lk{color:#ff4d6d}
.ep.seen .t{color:#9a9daa}
.badge{font-size:10.5px;font-weight:700;color:#fff;background:var(--pt);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.foot{padding:28px 20px 60px;text-align:center;color:var(--sub);font-size:12px}
/* 뷰어 */
#strip{max-width:720px;margin:0 auto;background:#fff}
.panel{position:relative;line-height:0}.panel img{width:100%;height:auto;display:block}
.panel svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.block svg{display:block;width:100%;height:auto}
.after{max-width:720px;margin:0 auto;background:var(--card)}
.likebar{display:flex;flex-direction:column;align-items:center;padding:30px 20px 22px;border-bottom:1px solid var(--line)}
.likebtn{width:76px;height:76px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:30px;color:#c3c6cf;transition:transform .12s}
.likebtn.on{color:#ff4d6d;border-color:#ffd0d8;background:#fff5f7}
.likebtn:active{transform:scale(.92)}
.likecnt{margin-top:8px;font-size:14px;font-weight:700}
.likehint{margin-top:4px;font-size:12px;color:var(--sub)}
.epnav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line)}
.epnav a{height:44px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.epnav a.off{visibility:hidden}
.epnav a.mid{background:#f7f7f9}
.nextcard{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.nextcard img{width:72px;height:72px;border-radius:8px;object-fit:cover}
.nextcard .s{font-size:12px;color:var(--pt);font-weight:700}
.nextcard .t{font-size:15px;font-weight:700;margin-top:3px}
.cmt{padding:18px 20px 40px}
.cmt h3{font-size:15px;margin:0 0 12px}
.cmt h3 span{color:var(--pt)}
.cform{display:flex;gap:8px;margin-bottom:14px}
.cform textarea{flex:1;min-height:46px;max-height:140px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:14px}
.cform button{width:70px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:700}
.cform button:disabled{opacity:.4}
.citem{padding:12px 0;border-top:1px solid var(--line)}
.citem .who{font-size:13px;font-weight:700}
.citem .when{font-size:11.5px;color:var(--sub);margin-left:6px;font-weight:400}
.citem .txt{font-size:14px;line-height:1.6;margin-top:5px;white-space:pre-wrap;word-break:break-word}
.citem .del{border:0;background:none;color:var(--sub);font-size:12px;float:right}
.cnote{font-size:13px;color:var(--sub);padding:14px;background:#f7f7f9;border-radius:10px;line-height:1.6}
.libhead{padding:22px 20px 8px;background:var(--card)}.libhead h2{margin:0;font-size:22px}.libhead p{margin:4px 0 0;color:var(--sub);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:16px 20px 24px;background:var(--card)}
.card{display:block}.cv{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#e9eaee}
.cv img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}.card:hover .cv img{transform:scale(1.04)}
.done{position:absolute;left:8px;top:8px;background:#16171b;color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px}
.ct{font-weight:700;font-size:15px;margin-top:8px}.ca{font-size:12.5px;color:var(--sub);margin-top:2px}.cg{font-size:12px;color:var(--pt);margin-top:4px}
.cr{font-size:11.5px;color:var(--sub);margin-top:4px}
.soon .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#9a9daa;font-size:14px;line-height:1.6}.soon .ct{color:#9a9daa}
.soonep{opacity:.55}.ph2{width:96px;height:96px;border-radius:8px;flex:none;background:#e3e4e8;display:grid;place-items:center;font-size:22px;font-weight:700;color:#9a9daa}
.toTop{position:fixed;right:16px;bottom:18px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(22,23,27,.75);color:#fff;font-size:18px;display:none;z-index:15}
</style></head><body>
<div id="bar"><div class="wrap"><a id="logo" href="#">중계소 웹툰</a><div class="ttl" id="barTitle"></div><button class="ic" id="barList" aria-label="목록" title="회차 목록">☰</button></div></div>
<main id="app"></main>
<button class="toTop" id="toTop" aria-label="맨 위로">↑</button>
<script>
(function(){
const W=1000, ink='#17181d';
const FS="'Noto Sans KR','Noto Sans CJK KR',sans-serif";
const FM="'Nanum Myeongjo','Noto Serif CJK KR',serif";
const FX="'Black Han Sans','Noto Sans CJK KR',sans-serif";
const FP="'Nanum Pen Script','Nanum Myeongjo',cursive";
const f1=n=>Math.round(n*10)/10;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* ---------- 글자 ---------- */
function tw(l,fs){let n=0;for(const ch of l){n+=/[ㄱ-힝]/.test(ch)?1:(ch===' '?0.33:(ch==='…'?0.9:0.6))}return n*fs}
function txt(x,y,lines,o={}){
  const fs=o.fs||24, lh=o.lh||fs*1.4, f=o.f||FS, fill=o.fill||ink, w=o.w||700, a=o.a||'middle';
  const y0=y-(lines.length-1)*lh/2;
  return lines.map((l,i)=>`<text x="${x}" y="${f1(y0+i*lh)}" font-family="${f}" font-size="${fs}" font-weight="${w}" fill="${fill}" text-anchor="${a}" dominant-baseline="central"${o.ls?` letter-spacing="${o.ls}"`:''}${o.op?` opacity="${o.op}"`:''}>${l}</text>`).join('');
}
function bubble(x,y,lines,o={}){
  const fs=o.fs||24, lh=fs*1.42, type=o.type||'normal';
  const w=Math.max(...lines.map(l=>tw(l,fs)))+(o.padx||58), h=lines.length*lh+(o.pady||30);
  const tail=o.tail; let s='';
  if(type==='normal'){
    if(tail){const [tx,ty]=tail,a=Math.atan2(ty-y,tx-x),px=-Math.sin(a),py=Math.cos(a);
      s+=`<polygon points="${f1(x+px*15)},${f1(y+py*15)} ${f1(x-px*15)},${f1(y-py*15)} ${tx},${ty}" fill="#fff" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`;}
    s+=`<rect x="${f1(x-w/2)}" y="${f1(y-h/2)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(Math.min(h/2,46))}" fill="#fff" stroke="${ink}" stroke-width="3"/>`;
    if(tail){const [tx,ty]=tail,a=Math.atan2(ty-y,tx-x),px=-Math.sin(a),py=Math.cos(a),mx=x+(tx-x)*.8,my=y+(ty-y)*.8;
      s+=`<polygon points="${f1(x+px*11)},${f1(y+py*11)} ${f1(x-px*11)},${f1(y-py*11)} ${f1(mx)},${f1(my)}" fill="#fff"/>`;}
  } else if(type==='thought'){
    if(tail){const [tx,ty]=tail;for(let i=1;i<=3;i++){const k=.62+i*.11,r=10-i*2.4;s+=`<circle cx="${f1(x+(tx-x)*k)}" cy="${f1(y+(ty-y)*k)}" r="${f1(r)}" fill="#fff" stroke="${ink}" stroke-width="2.5"/>`}}
    s+=`<rect x="${f1(x-w/2)}" y="${f1(y-h/2)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(h/2)}" fill="#fff" stroke="${ink}" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>`;
    s+=`<rect x="${f1(x-w/2)}" y="${f1(y-h/2)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(h/2)}" fill="none" stroke="${ink}" stroke-width="1" opacity=".25"/>`;
  } else if(type==='radio'||type==='shout'){
    const n=type==='radio'?46:30, k=type==='radio'?1.07:1.2, rx=w/2+(type==='shout'?26:12), ry=h/2+(type==='shout'?22:10);
    let pts=[]; const r=rng(Math.round(x+y));
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2, rr=(i%2?1:k)+(type==='radio'?(r()-.5)*.04:(r()-.5)*.08); pts.push(`${f1(x+Math.cos(a)*rx*rr)},${f1(y+Math.sin(a)*ry*rr)}`)}
    if(tail){const [tx,ty]=tail; const a=Math.atan2(ty-y,tx-x); const sx=x+Math.cos(a)*rx*.95, sy=y+Math.sin(a)*ry*.95;
      if(type==='radio'){const px=-Math.sin(a)*14,py=Math.cos(a)*14; s+=`<polyline points="${f1(sx)},${f1(sy)} ${f1(sx+(tx-sx)*.35+px)},${f1(sy+(ty-sy)*.35+py)} ${f1(sx+(tx-sx)*.6-px)},${f1(sy+(ty-sy)*.6-py)} ${tx},${ty}" fill="none" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`;}
      else {const px=-Math.sin(a),py=Math.cos(a); s+=`<polygon points="${f1(x+px*20)},${f1(y+py*20)} ${f1(x-px*20)},${f1(y-py*20)} ${tx},${ty}" fill="#fff" stroke="${ink}" stroke-width="3.5" stroke-linejoin="round"/>`;}
    }
    s+=`<polygon points="${pts.join(' ')}" fill="${type==='radio'?'#eef1ee':'#fff'}" stroke="${ink}" stroke-width="${type==='radio'?2.5:3.5}" stroke-linejoin="round"/>`;
    if(type==='shout'&&tail){const [tx,ty]=tail,a=Math.atan2(ty-y,tx-x),px=-Math.sin(a),py=Math.cos(a),mx=x+(tx-x)*.72,my=y+(ty-y)*.72;
      s+=`<polygon points="${f1(x+px*15)},${f1(y+py*15)} ${f1(x-px*15)},${f1(y-py*15)} ${f1(mx)},${f1(my)}" fill="#fff"/>`;}
  }
  s+=txt(x,y,lines,{fs,lh,w:type==='radio'?500:(type==='shout'?900:700),fill:type==='radio'?'#3a3d3a':ink,ls:type==='radio'?1:0});
  return s;
}
function cap(x,y,lines,o={}){
  const fs=o.fs||22, lh=fs*1.55, dark=o.dark;
  const w=Math.max(...lines.map(l=>tw(l,fs)))+50, h=lines.length*lh+26;
  return `<rect x="${f1(x-w/2)}" y="${f1(y-h/2)}" width="${f1(w)}" height="${f1(h)}" fill="${dark?'#08090d':'#fffdf6'}" stroke="${dark?'#cfc8b6':ink}" stroke-width="2"/>`+
    txt(x,y,lines,{fs,lh,f:FM,fill:dark?'#efe9da':ink,w:700});
}
function sfx(x,y,t,o={}){
  const fs=o.fs||60;
  return `<text x="${x}" y="${y}" font-family="${FX}" font-size="${fs}" fill="${o.fill||ink}" stroke="${o.stroke||'#fff'}" stroke-width="${o.sw||8}" paint-order="stroke" stroke-linejoin="round" text-anchor="middle" dominant-baseline="central" transform="rotate(${o.r||0} ${x} ${y})" letter-spacing="${o.ls||0}" opacity="${o.op||1}">${t}</text>`;

/* ---------- 이 브라우저의 기록(읽은 화) ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let seenAll=store.get('relay_seen2',{});
const seenOf=k=>(seenAll[k]=seenAll[k]||{});
function tipCard(it){
  const lh=62, h=170+it.lines.length*lh+50;
  let s=`<rect width="${W}" height="${h}" fill="#eef6f0"/><rect x="60" y="50" width="880" height="${h-100}" rx="22" fill="#fff" stroke="#00b860" stroke-width="4"/>`+
    `<rect x="60" y="50" width="880" height="86" rx="22" fill="#00b860"/><rect x="60" y="110" width="880" height="26" fill="#00b860"/>`+
    txt(500,93,['생존 노트 · '+it.tip],{fs:36,fill:'#fff',w:900});
  it.lines.forEach((l,i)=>{const y=190+i*lh; s+=`<circle cx="125" cy="${y}" r="20" fill="#00b860"/>`+txt(125,y,[String(i+1)],{fs:24,fill:'#fff',w:900})+txt(165,y,[l],{fs:30,fill:'#1d2a22',w:500,a:'start'});});
  return [h,s];
}
/* ---------- 작품 홈 ---------- */
let order='old';
function home(){
  const seen=seenOf(S.key);
  const all=[]; for(let i=1;i<=S.plan;i++){const e=DATA.find(x=>x.n===i); all.push(e||{n:i,title:S.titles[i-1]||'',soon:true});}
  const list=order==='old'?all:[...all].reverse();
  const lastSeen=Math.max(0,...Object.keys(seen).map(Number));
  const avail=DATA.map(e=>e.n), maxN=Math.max(...avail);
  const startN=lastSeen&&lastSeen<maxN?lastSeen+1:1;
  return `<div class="wrap">
  <div class="hero"><img src="${S.hero}" alt=""><div class="shade"></div><div class="info">
    <h1>${esc(S.title)}</h1><div class="au">${esc(S.author)} · ${esc(S.status)} · ${DATA.length}/${S.plan}화</div>
    <div class="tags">${S.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div></div></div>
  <div class="box"><p class="logline">${esc(S.logline)}</p>
    <div class="acts"><a class="btn main" href="#${S.key}/ep${startN}">${lastSeen&&lastSeen<maxN?`이어보기 · ${startN}화`:'첫화 보기'}</a><a class="btn" href="#${S.key}/ep${maxN}">최신화 보기</a></div></div>
  <div class="lhead"><b>전체 ${S.plan}화 <span style="color:var(--sub);font-weight:400;font-size:13px">· ${esc(S.note)}</span></b><div><button data-ord="old" class="${order==='old'?'on':''}">1화부터</button> · <button data-ord="new" class="${order==='new'?'on':''}">최신순</button></div></div>
  ${list.map(e=>e.soon?`<div class="ep soonep"><div class="ph2">${e.n}</div><div><div class="t">${e.n}화. ${esc(e.title)}</div><div class="m"><span>업데이트 예정</span></div></div></div>`:
    `<a class="ep ${seen[e.n]?'seen':''}" href="#${S.key}/ep${e.n}"><img loading="lazy" src="${S.thumbPrefix}${pad(e.n)}.jpg" alt=""><div>
     <div class="t">${e.n}화. ${esc(e.title)}${e.n===maxN&&S.status==='연재중'?'<span class="badge">NEW</span>':''}</div>
     <div class="m"><span>2026.11.20</span>${seen[e.n]?'<span>읽음</span>':''}</div></div></a>`).join('')}
  <div class="foot">그림은 생성형 AI(FLUX.2 klein)로 만들었어요.</div></div>`;
}
/* ---------- 뷰어 ---------- */
function strip(n){
  const ep=DATA.find(e=>e.n===n); let night=false, html='';
  const bg=()=>night?NIGHTBG:DAYBG;
  html+=`<div class="block" style="background:#05070d">${svg(560,`<rect width="${W}" height="560" fill="#05070d"/><image href="${S.coverPrefix}${pad(n)}_cover.jpg" x="0" y="0" width="1000" height="560" preserveAspectRatio="xMidYMid slice" opacity=".55"/><rect width="${W}" height="560" fill="url(#cg)"/><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset=".3" stop-color="#05070d" stop-opacity="0"/><stop offset="1" stop-color="#05070d"/></linearGradient></defs>`+txt(500,400,['이름 없는 중계소'],{fs:58,f:FM,fill:'#f2ecdc',w:800,ls:5})+txt(500,475,[`${n}화 · ${ep.title}`],{fs:30,f:FM,fill:'#c4bdac',w:700,ls:2}))}</div><div style="height:60px;background:${DAYBG}"></div>`;
  for(const it of ep.items){
    if(it.mode){night=(it.mode==='night'||it.mode==='cam');continue}
    if(it.gap!==undefined){ if(it.to==='night'){html+=`<div style="height:${it.gap}px;background:linear-gradient(${DAYBG},${NIGHTBG})"></div>`;night=true;} else html+=`<div style="height:${it.gap}px;background:${bg()}"></div>`; continue;}
    if(it.img){html+=`<div class="panel" data-id="${it.img}" style="background:${bg()};padding:0 0 14px"><div style="position:relative"><img loading="lazy" src="img/${it.img}.jpg" width="1000" height="${it.h}" alt="">${svg(it.h,it.ov.map(o=>overlay(o,it.h,night)).join(''))}</div></div>`; continue;}
    let h=it.h||420, inner='';
    if(it.tip){[h,inner]=tipCard(it);}
    else if(it.card){const st=it.style||'dark'; const b=st==='paper'?'#ece7da':(night?'#08090d':'#0a0a0c'), fg=st==='paper'?'#17181d':'#efe9da';
      inner=`<rect width="${W}" height="${h}" fill="${b}"/>`+txt(500,h/2,it.card,{fs:40,f:FM,fill:fg,w:800,lh:68,ls:2});}
    else if(it.rcard){const r=rng(h);inner=`<rect width="${W}" height="${h}" fill="#141814"/>`;
      if(it.glitch)for(let i=0;i<50;i++){inner+=`<rect x="${f1(r()*140-90)}" y="${f1(r()*h)}" width="${f1(400+r()*800)}" height="${f1(2+r()*20)}" fill="${r()<.5?'#e9f0e6':'#5e6a5c'}" opacity="${f1(.06+r()*.22)}"/>`}
      inner+=bubble(500,h/2,it.rcard,{type:'radio',fs:it.glitch?70:52});}
    else if(it.sfxcard){inner=`<rect width="${W}" height="${h}" fill="${bg()}"/>`+sfx(500,h/2,it.sfxcard,{fs:56,fill:'#8e99b3',stroke:'#0b0d13',sw:4,ls:8});}
    else if(it.notes){const g=it.notes; const fs=g.length>1?40:46; let y=0; const parts=[];
      for(const lines of g){const lh=fs*1.25,hh=lines.length*lh+50;parts.push([lines,hh]);y+=hh+40;}
      h=it.h||Math.max(380,y+80); inner=`<rect width="${W}" height="${h}" fill="#3b3226"/>`;
      let yy=(h-y+40)/2; parts.forEach(([lines,hh],i)=>{inner+=paper(500+(i%2?40:-30),yy+hh/2,lines,fs,i%2?2:-2);yy+=hh+40;});}
    html+=`<div class="block" style="background:${it.tip?'#eef6f0':bg()}">${svg(h,inner)}</div>`;
  }
  const maxN=Math.max(...DATA.map(e=>e.n)), fin=S.status==='완결'&&n===maxN;
  html+=`<div class="block" style="background:${NIGHTBG}">${svg(300,`<rect width="${W}" height="300" fill="${NIGHTBG}"/>`+txt(500,150,[fin?'― 완결 ―':`― ${n}화 끝 ―`],{fs:38,f:FM,fill:'#cfc8b6',w:800,ls:6}))}</div>`;
  return html;
}
function afterHTML(n){
  const maxN=Math.max(...DATA.map(e=>e.n)), nx=DATA.find(e=>e.n===n+1);
  const nextTitle=S.titles[n]||'';
  return `<div class="epnav"><a class="${n===1?'off':''}" href="#${S.key}/ep${n-1}">‹ 이전화</a><a class="mid" href="#${S.key}">목록</a><a class="${nx?'':'off'}" href="#${S.key}/ep${n+1}">다음화 ›</a></div>
  ${nx?`<a class="nextcard" href="#${S.key}/ep${nx.n}"><img src="${S.thumbPrefix}${pad(nx.n)}.jpg" alt=""><div><div class="s">다음 화</div><div class="t">${nx.n}화. ${esc(nx.title)}</div></div></a>`:
     (n<S.plan?`<div class="nextcard"><div><div class="s">다음 화 업데이트 예정</div><div class="t">${n+1}화. ${esc(nextTitle)}</div></div></div>`:`<div class="nextcard"><div><div class="s">완결</div><div class="t">끝까지 읽어 주셔서 고마워요.</div></div></div>`)}
  <div style="height:40px"></div>`;
}
function library(){
  document.getElementById('barTitle').textContent='';
  return `<div class="wrap"><div class="libhead"><h2>웹툰</h2><p>무료로 보는 연재 웹툰</p></div>
  <div class="grid">${SER.map(x=>{const sn=seenOf(x.key);const ls=Math.max(0,...Object.keys(sn).map(Number));return `<a class="card" href="#${x.key}"><div class="cv"><img src="${x.poster}" alt="${esc(x.title)} 표지"><span class="done" style="${x.status==='연재중'?'background:#00b860':''}">${esc(x.status)}</span></div>
      <div class="ct">${esc(x.title)}</div><div class="ca">${esc(x.author)}</div><div class="cg">${x.tags.map(t=>'#'+esc(t)).join(' ')}</div>
      <div class="cr">${x.eps.length}/${x.plan}화${ls?` · ${ls}화까지 읽음`:''}</div></a>`}).join('')}
  </div><div class="foot">그림은 생성형 AI(FLUX.2 klein)로 만들었어요.</div></div>`;
}
let curView=null;
function route(){
  const h=location.hash; const m=/^#(\w+)(?:\/ep(\d+))?$/.exec(h); const app=document.getElementById('app');
  const ser=m&&SER.find(x=>x.key===m[1]);
  if(ser){ S=ser; DATA=S.eps; }
  const n=m&&m[2]?+m[2]:0;
  if(ser&&n&&DATA.find(e=>e.n===n)){
    curView=n; document.getElementById('barTitle').textContent=`${n}화. ${DATA.find(e=>e.n===n).title}`;
    app.innerHTML=`<div id="strip">${strip(n)}</div><div class="after">${afterHTML(n)}</div>`;
    seenOf(S.key)[n]=1; store.set('relay_seen2',seenAll);
  } else if(ser){
    curView=0; app.innerHTML=home(); document.getElementById('barTitle').textContent=S.title;
    app.querySelectorAll('[data-ord]').forEach(b=>b.onclick=()=>{order=b.dataset.ord;route()});
  } else { curView=-1; app.innerHTML=library(); }
  window.scrollTo(0,0);
}
document.getElementById('barList').onclick=()=>{location.hash=curView>0?'#'+S.key:'';};
const tt=document.getElementById('toTop'); tt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
window.addEventListener('scroll',()=>{tt.style.display=window.scrollY>1200?'block':'none'},{passive:true});
window.addEventListener('hashchange',route);
// 예전 주소(#relay/epN) 호환: 압축판 10화 → 새 구성으로 연결
route();
})();
</script></body></html>
